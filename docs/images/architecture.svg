<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="820" height="380" fill="#ffffff"/>

  <!-- sources -->
  <rect x="20" y="60" width="170" height="60" rx="8" fill="#fde8e7" stroke="#d9534f"/>
  <text x="105" y="86" text-anchor="middle" font-weight="bold">TTC live feed</text>
  <text x="105" y="105" text-anchor="middle" font-size="12">GTFS-RT vehicles</text>

  <rect x="20" y="230" width="170" height="60" rx="8" fill="#fde8e7" stroke="#d9534f"/>
  <text x="105" y="256" text-anchor="middle" font-weight="bold">Toronto Open Data</text>
  <text x="105" y="275" text-anchor="middle" font-size="12">static GTFS schedule</text>

  <!-- ec2 / k3s box -->
  <rect x="240" y="20" width="560" height="340" rx="12" fill="#f4f7fb" stroke="#337ab7" stroke-dasharray="6 4"/>
  <text x="258" y="44" font-weight="bold" fill="#337ab7">AWS EC2 t4g.small  ·  k3s (made with Terraform)</text>

  <rect x="270" y="60" width="170" height="60" rx="8" fill="#e6f0fa" stroke="#337ab7"/>
  <text x="355" y="86" text-anchor="middle" font-weight="bold">Go poller</text>
  <text x="355" y="105" text-anchor="middle" font-size="12">every 30 s</text>

  <rect x="270" y="230" width="170" height="60" rx="8" fill="#e6f0fa" stroke="#337ab7"/>
  <text x="355" y="256" text-anchor="middle" font-weight="bold">Go loader</text>
  <text x="355" y="275" text-anchor="middle" font-size="12">nightly CronJob</text>

  <rect x="500" y="110" width="180" height="90" rx="8" fill="#e8f5e9" stroke="#4caf50"/>
  <text x="590" y="142" text-anchor="middle" font-weight="bold">PostgreSQL 16</text>
  <text x="590" y="162" text-anchor="middle" font-size="12">positions (7 days)</text>
  <text x="590" y="180" text-anchor="middle" font-size="12">schedule, coverage</text>

  <rect x="500" y="270" width="180" height="60" rx="8" fill="#fff8e1" stroke="#f0ad4e"/>
  <text x="590" y="296" text-anchor="middle" font-weight="bold">Ghost report</text>
  <text x="590" y="315" text-anchor="middle" font-size="12">nightly SQL + charts</text>

  <rect x="20" y="310" width="170" height="50" rx="8" fill="#eeeeee" stroke="#999"/>
  <text x="105" y="331" text-anchor="middle" font-size="12" font-weight="bold">GitHub Actions</text>
  <text x="105" y="348" text-anchor="middle" font-size="12">builds + deploys image</text>

  <!-- arrows -->
  <line x1="190" y1="90" x2="268" y2="90" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="190" y1="260" x2="268" y2="260" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="440" y1="100" x2="498" y2="140" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="440" y1="250" x2="498" y2="180" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="590" y1="200" x2="590" y2="268" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="190" y1="335" x2="238" y2="335" stroke="#999" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#a)"/>
</svg>
