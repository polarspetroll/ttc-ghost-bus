# dont commit the real one. easier way:
#   PASS=$(openssl rand -hex 16)
#   kubectl -n ttc create secret generic ghost-db \
#     --from-literal=POSTGRES_PASSWORD=$PASS \
#     --from-literal=DATABASE_URL="postgres://ghost:$PASS@postgres:5432/ghost?sslmode=disable"
apiVersion: v1
kind: Secret
metadata:
  name: ghost-db
  namespace: ttc
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
  DATABASE_URL: postgres://ghost:change-me@postgres:5432/ghost?sslmode=disable
